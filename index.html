<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner</title>
<style>
:root{--bg:#f4f4f2;--fg:#15171a;--mut:#6b7078;--card:#fff;--acc:#16a34a;--ln:#0002;--cacc:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d0f;--fg:#f2f3f5;--mut:#9aa0a8;--card:#17191c;--acc:#3ddc97;--ln:#fff2}}
:root[data-theme="dark"]{--bg:#0c0d0f;--fg:#f2f3f5;--mut:#9aa0a8;--card:#17191c;--acc:#3ddc97;--ln:#fff2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.scr{position:fixed;inset:0;transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1)}
.scr.off{opacity:0;pointer-events:none;transform:scale(.97)}
#cam{background:#000;color:#fff}
.stage{position:absolute;inset:0}
#v,#ov{position:absolute;inset:0;width:100%;height:100%}
#v{object-fit:contain}
#poly{fill:rgba(61,220,151,.14);stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:0;transition:stroke .3s,fill .3s,opacity .25s}
#poly.lock{stroke:var(--cacc);fill:rgba(61,220,151,.26)}
#dots circle{fill:#fff;transition:fill .3s}
#poly.lock~#dots circle{fill:var(--cacc)}
#pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:99px;background:rgba(20,22,25,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:14px;font-weight:500;white-space:nowrap;transition:background .3s,color .3s}
#pill.ok{background:var(--cacc);color:#04210f}
.bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.side{width:64px;height:48px;border-radius:16px;background:rgba(20,22,25,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;font-size:14px;font-weight:600;transition:transform .15s,background .3s,color .3s;cursor:pointer}
.side:active{transform:scale(.92)}
#auto.on{background:var(--cacc);color:#04210f}
#shut{position:relative;width:84px;height:84px;border-radius:50%;transition:transform .15s}
#shut:active{transform:scale(.9)}
#shut svg{position:absolute;inset:0;transform:rotate(-90deg)}
#shut circle{fill:none;stroke-width:4}
.trk{stroke:rgba(255,255,255,.45)}
#prog{stroke:var(--cacc);stroke-linecap:round;stroke-dasharray:238.76;stroke-dashoffset:238.76;transition:stroke-dashoffset .12s linear}
#shut i{position:absolute;inset:10px;border-radius:50%;background:#fff;transition:transform .2s}
#shut:active i{transform:scale(.92)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#intro,#busy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#1d2a24,#0b0c0e 70%);transition:opacity .4s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:34px;letter-spacing:-.03em}
#intro p{margin:0;color:#a5abb3;max-width:300px}
.btn{padding:15px 26px;border-radius:16px;font-weight:600;background:var(--cacc);color:#04210f;transition:transform .15s}
.btn:active{transform:scale(.95)}
.lnk{color:#a5abb3;font-size:14px;text-decoration:underline;cursor:pointer}
#err{color:#ff8a80;font-size:14px;min-height:20px;max-width:300px}
.ico{width:76px;height:76px;border-radius:22px;border:2px solid var(--cacc);display:grid;place-items:center;margin-bottom:6px}
#busy{background:rgba(8,9,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;z-index:5}
#busy.on{opacity:1;pointer-events:auto}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid #fff3;border-top-color:var(--cacc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#res{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);gap:16px}
.top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px}
.ghost{padding:9px 14px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-weight:500;transition:transform .15s}
.ghost:active{transform:scale(.94)}
.view{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#rc{max-width:min(92vw,640px);max-height:100%;width:auto;height:auto;border-radius:6px;box-shadow:0 20px 60px #0004,0 0 0 1px var(--ln);background:#fff}
#res:not(.off) #rc{animation:pop .5s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(18px)}}
.chips{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--ln)}
.chips button{padding:9px 16px;border-radius:12px;font-weight:500;font-size:14px;color:var(--mut);transition:background .25s,color .25s,transform .15s}
.chips button:active{transform:scale(.94)}
.chips button.on{background:var(--acc);color:#04210f}
.acts{display:flex;gap:10px;width:100%;max-width:420px}
.acts button{flex:1;padding:15px;border-radius:16px;font-weight:600;transition:transform .15s}
.acts button:active{transform:scale(.95)}
.p{background:var(--acc);color:#04210f}.s{background:var(--card);box-shadow:0 0 0 1px var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);padding:10px 18px;border-radius:99px;background:#111;color:#fff;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="cam" class="scr">
  <div class="stage"><video id="v" playsinline muted autoplay></video><svg id="ov" preserveAspectRatio="xMidYMid meet"><polygon id="poly"/><g id="dots"></g></svg></div>
  <div id="pill">Cherche une feuille…</div>
  <div class="bar">
    <label class="side" title="Importer une photo"><input id="f" type="file" accept="image/*" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></label>
    <button id="shut" aria-label="Capturer"><svg viewBox="0 0 84 84"><circle class="trk" cx="42" cy="42" r="38"/><circle id="prog" cx="42" cy="42" r="38"/></svg><i></i></button>
    <button id="auto" class="side on">Auto</button>
  </div>
  <div id="flash"></div>
  <div id="intro">
    <div class="ico"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#3ddc97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/></svg></div>
    <h1>Scanner</h1>
    <p>Pose ta feuille sur une surface plus sombre. Le cadre se colle dessus tout seul et la photo est redressée automatiquement.</p>
    <button class="btn" id="go">Démarrer la caméra</button>
    <label class="lnk">Ou importer une photo<input id="f2" type="file" accept="image/*" hidden></label>
    <div id="err"></div>
  </div>
</div>

<div id="res" class="scr off">
  <div class="top"><button class="ghost" id="back">← Refaire</button><b>Document</b><span style="width:84px"></span></div>
  <div class="view"><canvas id="rc"></canvas></div>
  <div class="chips" id="chips"><button data-m="0">Original</button><button data-m="1" class="on">Document</button><button data-m="2">N&amp;B</button></div>
  <div class="acts"><button class="s" id="djpg">Image JPG</button><button class="p" id="dpdf">PDF</button></div>
</div>
<div id="busy"><div class="spin"></div><div>Redressement en cours…</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}},N=16;
const vid=$('#v'),ov=$('#ov'),poly=$('#poly'),dots=$('#dots'),pill=$('#pill'),prog=$('#prog');
let stream,W=0,H=0,quad=null,shown=null,stable=0,auto=true,busy=false,last=0,base=null,mode=1,locked=false;
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
for(let i=0;i<4;i++)dots.appendChild(document.createElementNS('http://www.w3.org/2000/svg','circle'));
const go=n=>{$('#cam').classList.toggle('off',n!=='cam');$('#res').classList.toggle('off',n!=='res')};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};

async function start(){
  $('#err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});
    vid.srcObject=stream;await vid.play();
    try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    W=vid.videoWidth;H=vid.videoHeight;ov.setAttribute('viewBox','0 0 '+W+' '+H);
    $('#intro').classList.add('hide');vib(10);loop();
  }catch(e){$('#err').textContent='Caméra indisponible ici. Autorise l’accès ou importe une photo.'}
}

/* Détection : Otsu + plus grande zone claire + 4 coins extrêmes */
function detect(el,vw,vh){
  const w=160,h=Math.round(160*vh/vw),n=w*h;sc.width=w;sc.height=h;
  sx.drawImage(el,0,0,w,h);
  const d=sx.getImageData(0,0,w,h).data,g=new Uint8Array(n),hist=new Float32Array(256);
  for(let i=0;i<n;i++){const v=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;g[i]=v;hist[v]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sb=0,wb=0,mx=0,t=128,cm=0;
  for(let i=0;i<256;i++){wb+=hist[i];const wf=n-wb;if(!wb)continue;if(!wf)break;sb+=i*hist[i];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>mx){mx=v;t=i;cm=mf-mb}}
  if(cm<26)return null;
  const m=new Uint8Array(n),seen=new Uint8Array(n),st=new Int32Array(n);
  for(let i=0;i<n;i++)m[i]=g[i]>t?1:0;
  let best=null;
  for(let s=0;s<n;s++){
    if(!m[s]||seen[s])continue;
    let sp=0;st[sp++]=s;seen[s]=1;
    const c={n:0,tl:[1e9,0,0],br:[-1e9,0,0],tr:[-1e9,0,0],bl:[1e9,0,0]};
    while(sp){
      const p=st[--sp],x=p%w,y=(p/w)|0,a=x+y,b=x-y;c.n++;
      if(a<c.tl[0])c.tl=[a,x,y];if(a>c.br[0])c.br=[a,x,y];if(b>c.tr[0])c.tr=[b,x,y];if(b<c.bl[0])c.bl=[b,x,y];
      if(x>0&&m[p-1]&&!seen[p-1]){seen[p-1]=1;st[sp++]=p-1}
      if(x<w-1&&m[p+1]&&!seen[p+1]){seen[p+1]=1;st[sp++]=p+1}
      if(y>0&&m[p-w]&&!seen[p-w]){seen[p-w]=1;st[sp++]=p-w}
      if(y<h-1&&m[p+w]&&!seen[p+w]){seen[p+w]=1;st[sp++]=p+w}
    }
    if(!best||c.n>best.n)best=c;
  }
  if(!best||best.n<n*.08||best.n>n*.94)return null;
  const q=[best.tl,best.tr,best.br,best.bl].map(p=>[p[1],p[2]]);
  let ar=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];ar+=a[0]*b[1]-b[0]*a[1]}ar=Math.abs(ar)/2;
  if(!ar||best.n/ar<.6)return null;
  for(let i=0;i<4;i++)if(Math.hypot(q[i][0]-q[(i+1)%4][0],q[i][1]-q[(i+1)%4][1])<w*.15)return null;
  const k=vw/w;return q.map(p=>[(p[0]+.5)*k,(p[1]+.5)*k]);
}

function loop(){
  if(!stream)return;requestAnimationFrame(loop);
  const t=performance.now();
  if(!busy&&t-last>66){last=t;step(detect(vid,W,H))}
  draw();
}
function step(q){
  if(!q){quad=null;stable=0;return ui()}
  if(!quad){quad=q;vib(8)}else{
    const mv=q.reduce((s,p,i)=>s+Math.hypot(p[0]-quad[i][0],p[1]-quad[i][1]),0)/4/W;
    if(mv>.12){quad=q;stable=0}
    else{quad=quad.map((p,i)=>[p[0]+(q[i][0]-p[0])*.45,p[1]+(q[i][1]-p[1])*.45]);stable=mv<.012?stable+1:Math.max(0,stable-2)}
  }
  ui();
  if(auto&&stable>=N)capture();
}
function ui(){
  const lock=!!quad&&stable>=6;
  if(lock&&!locked)vib(14);locked=lock;
  poly.classList.toggle('lock',lock);pill.classList.toggle('ok',lock);
  pill.textContent=!quad?'Cherche une feuille…':lock?(auto?'Ne bouge plus…':'Prête — appuie pour capturer'):'Feuille détectée';
  prog.style.strokeDashoffset=238.76*(1-(quad&&auto?Math.min(1,stable/N):0));
}
function draw(){
  if(!quad){shown=null;poly.style.opacity=0;dots.style.opacity=0;return}
  shown=shown?shown.map((p,i)=>[p[0]+(quad[i][0]-p[0])*.3,p[1]+(quad[i][1]-p[1])*.3]):quad.map(p=>p.slice());
  poly.setAttribute('points',shown.map(p=>p.join(',')).join(' '));poly.style.opacity=1;dots.style.opacity=1;
  [...dots.children].forEach((c,i)=>{c.setAttribute('cx',shown[i][0]);c.setAttribute('cy',shown[i][1]);c.setAttribute('r',W*.009)});
}

async function capture(){
  if(busy)return;busy=true;vib([25,40,25]);
  const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(vid,0,0);
  const q=quad?quad.map(p=>p.slice()):full(W,H);
  stable=0;ui();await process(c,q);
}
const full=(w,h)=>[[w*.03,h*.03],[w*.97,h*.03],[w*.97,h*.97],[w*.03,h*.97]];

async function process(src,q){
  busy=true;$('#busy').classList.add('on');
  await new Promise(r=>setTimeout(r,60));
  base=warp(src,q);mode=1;show();
  $('#busy').classList.remove('on');go('res');
}

/* Redressement perspective (homographie) + échantillonnage bilinéaire */
function warp(src,q){
  const sw=src.width,sh=src.height,sd=src.getContext('2d').getImageData(0,0,sw,sh).data,L=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let w=Math.max(L(q[0],q[1]),L(q[3],q[2])),h=Math.max(L(q[0],q[3]),L(q[1],q[2]));
  const k=Math.min(1,2600/Math.max(w,h));w=Math.max(2,Math.round(w*k));h=Math.max(2,Math.round(h*k));
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q,sX=x0-x1+x2-x3,sY=y0-y1+y2-y3,dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,den=dx1*dy2-dx2*dy1;
  const g=den?(sX*dy2-dx2*sY)/den:0,hh=den?(dx1*sY-sX*dy1)/den:0;
  const a=x1-x0+g*x1,b=x3-x0+hh*x3,d=y1-y0+g*y1,e=y3-y0+hh*y3;
  const out=new ImageData(w,h),o=out.data,mxX=sw-1.001,mxY=sh-1.001;
  for(let y=0;y<h;y++){const v=y/h;for(let x=0;x<w;x++){
    const u=x/w,dn=g*u+hh*v+1;let X=(a*u+b*v+x0)/dn,Y=(d*u+e*v+y0)/dn;
    X=X<0?0:X>mxX?mxX:X;Y=Y<0?0:Y>mxY?mxY:Y;
    const ix=X|0,iy=Y|0,fx=X-ix,fy=Y-iy,p=(iy*sw+ix)*4,r=p+sw*4,wa=(1-fx)*(1-fy),wb=fx*(1-fy),wc=(1-fx)*fy,wd=fx*fy,j=(y*w+x)*4;
    o[j]=sd[p]*wa+sd[p+4]*wb+sd[r]*wc+sd[r+4]*wd;
    o[j+1]=sd[p+1]*wa+sd[p+5]*wb+sd[r+1]*wc+sd[r+5]*wd;
    o[j+2]=sd[p+2]*wa+sd[p+6]*wb+sd[r+2]*wc+sd[r+6]*wd;o[j+3]=255}}
  return out;
}

/* Filtres */
function filt(b,m){
  const o=new ImageData(new Uint8ClampedArray(b.data),b.width,b.height);if(!m)return o;
  const d=o.data,n=d.length/4,hs=new Uint32Array(256);
  for(let i=0;i<n;i++)hs[(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8]++;
  const pc=f=>{let c=0,t=n*f;for(let i=0;i<256;i++){c+=hs[i];if(c>=t)return i}return 255};
  const lo=pc(.02),hi=Math.max(lo+20,pc(m==1?.55:.5)),s=255/(hi-lo);
  for(let i=0;i<n;i++){const j=i*4;
    if(m==1){for(let c=0;c<3;c++){const v=(d[j+c]-lo)*s;d[j+c]=v}}
    else{let v=((d[j]*77+d[j+1]*150+d[j+2]*29)/256-lo)/(hi-lo);v=v<0?0:v>1?1:v;v=v*v*(3-2*v);v=v*v*(3-2*v);d[j]=d[j+1]=d[j+2]=v*255}}
  return o;
}
function show(){
  const o=filt(base,mode),c=$('#rc');c.width=o.width;c.height=o.height;c.getContext('2d').putImageData(o,0,0);
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.m===mode));
}

/* Export */
async function save(name,blob){
  try{
    const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});toast('Enregistré ✓');vib(15);return}
  }catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Téléchargé ✓');
}
const jpgBlob=()=>new Promise(r=>$('#rc').toBlob(r,'image/jpeg',.94));
const stamp=()=>'scan-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
function pdf(jpg,w,h){
  const W=595,Hh=Math.round(595*h/w),enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length},obj=s=>{offs.push(len);add(s)};
  add('%PDF-1.4\n');
  obj('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
  obj('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n');
  obj('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+Hh+']/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>endobj\n');
  offs.push(len);add('4 0 obj<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>stream\n');add(jpg);add('\nendstream endobj\n');
  const cs='q '+W+' 0 0 '+Hh+' 0 0 cm /I Do Q';
  obj('5 0 obj<</Length '+cs.length+'>>stream\n'+cs+'\nendstream endobj\n');
  const x=len;let t='xref\n0 6\n0000000000 65535 f \n';offs.forEach(o=>t+=String(o).padStart(10,'0')+' 00000 n \n');
  add(t+'trailer<</Size 6/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

/* Événements */
$('#go').onclick=start;
$('#shut').onclick=capture;
$('#auto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);stable=0;ui();vib(8)};
$('#back').onclick=()=>{vib(8);busy=false;stable=0;go('cam');if(!stream)$('#intro').classList.remove('hide')};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;vib(6);show()};
$('#djpg').onclick=async()=>{vib(10);save(stamp()+'.jpg',await jpgBlob())};
$('#dpdf').onclick=async()=>{vib(10);const c=$('#rc'),j=new Uint8Array(await (await jpgBlob()).arrayBuffer());save(stamp()+'.pdf',pdf(j,c.width,c.height))};
async function imp(e){
  const f=e.target.files[0];if(!f)return;busy=true;
  try{
    const bm=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,4096/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    await process(c,detect(c,c.width,c.height)||full(c.width,c.height));
  }catch(x){busy=false;toast('Image illisible')}
  e.target.value='';
}
$('#f').onchange=imp;$('#f2').onchange=imp;
</script>
</body>
