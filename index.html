<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#000000">
<title>Scanner</title>
<style>
:root{--bg:#f4f4f2;--fg:#15171a;--mut:#6b7078;--card:#fff;--acc:#16a34a;--ln:#0002;--cacc:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d0f;--fg:#f2f3f5;--mut:#9aa0a8;--card:#17191c;--acc:#3ddc97;--ln:#fff2}}
:root[data-theme="dark"]{--bg:#0c0d0f;--fg:#f2f3f5;--mut:#9aa0a8;--card:#17191c;--acc:#3ddc97;--ln:#fff2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.scr{position:fixed;inset:0;transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1)}
.scr.off{opacity:0;pointer-events:none;transform:scale(.97)}
#cam{background:#000;color:#fff}
.stage{position:absolute;inset:0}
#v,#ov{position:absolute;inset:0;width:100%;height:100%}
#v{object-fit:contain}
#poly{fill:rgba(61,220,151,.14);stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:0;transition:stroke .3s,fill .3s,opacity .25s}
#poly.lock{stroke:var(--cacc);fill:rgba(61,220,151,.26)}
#dots circle{fill:#fff;transition:fill .3s}
#poly.lock~#dots circle{fill:var(--cacc)}
#pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:99px;background:rgba(20,22,25,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:14px;font-weight:500;white-space:nowrap;transition:background .3s,color .3s}
#pill.ok{background:var(--cacc);color:#04210f}
.bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.side{width:64px;height:48px;border-radius:16px;background:rgba(20,22,25,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;font-size:14px;font-weight:600;transition:transform .15s,background .3s,color .3s;cursor:pointer}
.side:active{transform:scale(.92)}
#auto.on{background:var(--cacc);color:#04210f}
#shut{position:relative;width:84px;height:84px;border-radius:50%;transition:transform .15s}
#shut:active{transform:scale(.9)}
#shut svg{position:absolute;inset:0;transform:rotate(-90deg)}
#shut circle{fill:none;stroke-width:4}
.trk{stroke:rgba(255,255,255,.45)}
#prog{stroke:var(--cacc);stroke-linecap:round;stroke-dasharray:238.76;stroke-dashoffset:238.76;transition:stroke-dashoffset .12s linear}
#shut i{position:absolute;inset:10px;border-radius:50%;background:#fff;transition:transform .2s}
#shut:active i{transform:scale(.92)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#intro,#busy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#1d2a24,#0b0c0e 70%);transition:opacity .4s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:34px;letter-spacing:-.03em}
#intro p{margin:0;color:#a5abb3;max-width:300px}
.btn{padding:15px 26px;border-radius:16px;font-weight:600;background:var(--cacc);color:#04210f;transition:transform .15s}
.btn:active{transform:scale(.95)}
.lnk{color:#a5abb3;font-size:14px;text-decoration:underline;cursor:pointer}
#err{color:#ff8a80;font-size:14px;min-height:20px;max-width:300px}
.ico{width:76px;height:76px;border-radius:22px;border:2px solid var(--cacc);display:grid;place-items:center;margin-bottom:6px}
#busy{background:rgba(8,9,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;z-index:5}
#busy.on{opacity:1;pointer-events:auto}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid #fff3;border-top-color:var(--cacc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#res{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);gap:16px}
.top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:17px}
.ghost{padding:9px 14px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-weight:500;transition:transform .15s}
.ghost:active{transform:scale(.94)}
.view{flex:1;min-height:0;width:100%;display:grid;place-items:center}
#rc{max-width:min(92vw,640px);max-height:100%;width:auto;height:auto;border-radius:6px;box-shadow:0 20px 60px #0004,0 0 0 1px var(--ln);background:#fff}
#res:not(.off) #rc{animation:pop .5s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(18px)}}
.chips{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--ln)}
.chips button{padding:9px 16px;border-radius:12px;font-weight:500;font-size:14px;color:var(--mut);transition:background .25s,color .25s,transform .15s}
.chips button:active{transform:scale(.94)}
.chips button.on{background:var(--acc);color:#04210f}
.acts{display:flex;gap:10px;width:100%;max-width:420px}
.acts button{flex:1;padding:15px;border-radius:16px;font-weight:600;transition:transform .15s}
.acts button:active{transform:scale(.95)}
.p{background:var(--acc);color:#04210f}.s{background:var(--card);box-shadow:0 0 0 1px var(--ln)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,20px);padding:10px 18px;border-radius:99px;background:#111;color:#fff;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
:root{--spr:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1)}
html,body{-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{overflow:hidden}
.scr{transition:opacity .5s var(--ease),transform .7s var(--ease),filter .5s}
.scr.off{transform:scale(.94);filter:blur(10px)}
.side,#shut,.btn,.ghost,.acts button{transition:transform .55s var(--spr),background .3s,color .3s}
.side:active,.btn:active,.ghost:active,.acts button:active{transform:scale(.92);transition-duration:.1s}
#shut:active{transform:scale(.86);transition-duration:.1s}
#shut i{transition:transform .5s var(--spr)}
.side,#pill{background:rgba(30,32,36,.5);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
#pill.b{animation:bump .55s var(--spr)}
@keyframes bump{50%{transform:translateX(-50%) scale(1.08)}}
#poly{filter:drop-shadow(0 0 8px rgba(255,255,255,.3))}
#poly.lock{filter:drop-shadow(0 0 14px rgba(61,220,151,.75))}
#poly.snap{fill:rgba(255,255,255,.9);stroke-width:7px;transition:fill .08s,stroke-width .08s}
#guide{position:absolute;inset:16% 11%;border-radius:30px;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 0 0 100vmax rgba(0,0,0,.18);animation:br 2.6s ease-in-out infinite;transition:opacity .5s var(--ease),transform .6s var(--ease)}
@keyframes br{50%{transform:scale(1.025)}}
#cam.has #guide{opacity:0;transform:scale(1.08);animation:none}
#torch{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:16px;width:46px;height:46px;border-radius:50%}
.side[hidden]{display:none}
#torch.on{background:var(--cacc);color:#04210f}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:0;position:relative;width:min(100%,330px)}
.chips button{position:relative;z-index:1;text-align:center}
.chips button.on{background:none;color:#04210f}
.thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/3);border-radius:12px;background:var(--acc);transition:transform .55s var(--spr);box-shadow:0 4px 14px #0003}
#res{background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--acc) 12%,var(--bg)),var(--bg) 70%)}
#res:not(.off) #rc{animation:pop2 .9s var(--spr)}
@keyframes pop2{from{opacity:0;transform:scale(.8) translateY(50px) rotate(-2deg)}}
#res:not(.off) .chips,#res:not(.off) .acts,#res:not(.off) .top{animation:up .8s var(--ease) both}
#res:not(.off) .chips{animation-delay:.12s}#res:not(.off) .acts{animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.acts button{border-radius:18px;padding:16px}
.p{box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}
#busy>*{transform:scale(.9);transition:transform .5s var(--spr)}
#busy.on>*{transform:none}
.pbar{width:180px;height:4px;border-radius:4px;background:#fff2;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--cacc);transform-origin:left;transform:scaleX(0);transition:transform .25s linear}
#intro>*{animation:up .9s var(--ease) both}
#intro>:nth-child(2){animation-delay:.08s}#intro>:nth-child(3){animation-delay:.16s}#intro>:nth-child(4){animation-delay:.24s}#intro>:nth-child(5){animation-delay:.3s}
.tools{display:flex;align-items:center;gap:10px;width:min(100%,420px)}
.tools button{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:22px;flex:none;transition:transform .55s var(--spr)}
.tools button:active{transform:scale(.86);transition-duration:.1s}
#tilt{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:none;margin:0}
#tilt::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--ln)}
#tilt::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 2px 10px #0004,0 0 0 1px var(--ln)}
#tilt::-moz-range-track{height:4px;border-radius:4px;background:var(--ln)}
#tilt::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px #0004}
#ed{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);gap:16px;background:var(--bg)}
#ew{position:relative;display:inline-block;line-height:0}
#ec{display:block;max-width:92vw;max-height:calc(100dvh - 190px);width:auto;height:auto;border-radius:6px;box-shadow:0 20px 60px #0004,0 0 0 1px var(--ln)}
#es{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ep{fill:rgba(61,220,151,.16);stroke:var(--acc);stroke-width:2.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hd{fill:rgba(61,220,151,.28);stroke:var(--acc);stroke-width:3px;vector-effect:non-scaling-stroke;cursor:grab;touch-action:none;transition:fill .2s}
.hd:active{fill:rgba(61,220,151,.55)}
.hint{margin:0;color:var(--mut);font-size:14px}
.ghost.p2{background:var(--acc);color:#04210f}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ghost{display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.acts button{display:flex;align-items:center;justify-content:center;gap:8px}
.tools button{display:grid;place-items:center}.tools .ic{width:22px;height:22px}
.bar{isolation:isolate}
.bar::before{content:"";position:absolute;left:0;right:0;bottom:calc(-1*(env(safe-area-inset-bottom,0px) + 22px));height:230px;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:-1;pointer-events:none}
#pill::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.6);margin-right:9px;animation:pu 1.2s ease-in-out infinite}
#pill.ok::before{background:#04210f;animation:none}
@keyframes pu{50%{opacity:.25}}
#intro{background:#07090a;overflow:hidden;transition:opacity .6s var(--ease),transform .7s var(--ease),filter .6s}
#intro.hide{transform:scale(1.06);filter:blur(12px)}
#intro::before,#intro::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
#intro::before{background:radial-gradient(circle,#1f9a68,transparent 65%);top:-32vmax;left:-24vmax;animation:dr 14s ease-in-out infinite alternate}
#intro::after{background:radial-gradient(circle,#3a56ff,transparent 65%);bottom:-38vmax;right:-28vmax;opacity:.38;animation:dr 18s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#intro>*{position:relative;z-index:1}
#intro h1{font-size:clamp(30px,9vw,40px);line-height:1.05;letter-spacing:-.035em;font-weight:700}
#intro h1 span{background:linear-gradient(90deg,#3ddc97,#7cf0c4 50%,#8fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{width:150px;height:190px;margin-bottom:6px}
.sheet{position:absolute;inset:24px 28px;border-radius:8px;background:linear-gradient(160deg,#fff,#dfe4e1);box-shadow:0 24px 50px rgba(0,0,0,.5);padding:14px 12px;overflow:hidden;animation:fl2 5s ease-in-out infinite}
@keyframes fl2{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-6px)}}
.sheet i{display:block;height:5px;border-radius:3px;background:#c4cbc8;margin-bottom:9px}
.sheet i:nth-child(1){width:60%;background:#9aa5a0}.sheet i:nth-child(3){width:85%}.sheet i:nth-child(4){width:70%}
.sheet b{position:absolute;left:0;right:0;height:36px;top:-36px;background:linear-gradient(transparent,rgba(61,220,151,.55));border-bottom:2px solid #3ddc97;animation:sw 2.8s ease-in-out infinite}
@keyframes sw{0%{top:-36px}70%,100%{top:100%}}
.brk{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#3ddc97;stroke-width:3;stroke-linecap:round;animation:snp 3.4s var(--ease) infinite;filter:drop-shadow(0 0 8px rgba(61,220,151,.6))}
@keyframes snp{0%{transform:scale(1.25);opacity:0}30%{opacity:1}55%,100%{transform:scale(1);opacity:1}}
.feat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.feat span{padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:13px;color:#c9cfd6}
#go{position:relative;overflow:hidden;width:min(100%,320px);height:58px;font-size:17px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;box-shadow:0 10px 40px rgba(61,220,151,.35);transition:transform .55s var(--spr),opacity .3s}
#go::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sh 3.2s var(--ease) infinite}
@keyframes sh{60%,100%{transform:translateX(120%)}}
.gl{display:flex;align-items:center;justify-content:center;gap:8px;width:min(100%,320px);height:52px;border-radius:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#e8ebee;font-weight:500;font-size:15px;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .55s var(--spr),background .3s}
.gl:active{transform:scale(.95);transition-duration:.1s}
.pv{display:flex;align-items:center;gap:6px;color:#7f8790;font-size:12.5px}
</style>
</head>
<body>
<div id="cam" class="scr">
  <div class="stage"><video id="v" playsinline muted autoplay></video><div id="guide"></div><svg id="ov" preserveAspectRatio="xMidYMid meet"><polygon id="poly"/><g id="dots"></g></svg></div>
  <div id="pill">Cherche une feuille…</div>
  <button id="torch" class="side" hidden aria-label="Torche"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></button>
  <div class="bar">
    <label class="side" title="Importer une photo"><input id="f" type="file" accept="image/*" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></label>
    <button id="shut" aria-label="Capturer"><svg viewBox="0 0 84 84"><circle class="trk" cx="42" cy="42" r="38"/><circle id="prog" cx="42" cy="42" r="38"/></svg><i></i></button>
    <button id="auto" class="side on" aria-label="Capture automatique"><svg class="ic" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/></svg></button>
  </div>
  <div id="flash"></div>
  <div id="intro">
    <div class="hero"><div class="sheet"><i></i><i></i><i></i><i></i><b></b></div><svg class="brk" viewBox="0 0 100 128"><path d="M4 28V12a8 8 0 0 1 8-8h16M72 4h16a8 8 0 0 1 8 8v16M96 100v16a8 8 0 0 1-8 8H72M28 124H12a8 8 0 0 1-8-8v-16"/></svg></div>
    <h1>Tes documents,<br><span>parfaitement droits.</span></h1>
    <p>Pose ta feuille sur une surface plus sombre. Le cadre se colle dessus tout seul.</p>
    <div class="feat"><span>Détection auto</span><span>Redressement</span><span>JPG · PDF</span></div>
    <button class="btn" id="go"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 4h-5L8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></svg>Démarrer la caméra</button>
    <label class="gl"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Importer une photo<input id="f2" type="file" accept="image/*" hidden></label>
    <div id="err"></div>
    <div class="pv"><svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Tout reste sur ton appareil</div>
  </div>
</div>

<div id="res" class="scr off">
  <div class="top"><button class="ghost" id="back"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Refaire</button><b id="ttl">Document</b><button class="ghost" id="redit"><svg class="ic" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg>Recadrer</button></div>
  <div class="view"><canvas id="rc"></canvas></div>
  <div class="tools"><button id="rl" aria-label="Pivoter à gauche"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></svg></button><input id="tilt" type="range" min="-10" max="10" step=".5" value="0" aria-label="Inclinaison"><button id="rr" aria-label="Pivoter à droite"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></svg></button></div>
  <div class="chips" id="chips"><i class="thumb"></i><button data-m="0">Original</button><button data-m="1" class="on">Document</button><button data-m="2">N&amp;B</button></div>
  <div class="acts"><button class="s" id="djpg"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>JPG</button><button class="s" id="dshare"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Partager</button><button class="p" id="dpdf"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg>PDF</button></div>
</div>
<div id="ed" class="scr off">
  <div class="top"><button class="ghost" id="ecan">Annuler</button><b>Recadrer</b><button class="ghost p2" id="eok"><svg class="ic" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>Valider</button></div>
  <div class="view"><div id="ew"><canvas id="ec"></canvas><svg id="es"><polygon id="ep"/></svg></div></div>
  <p class="hint">Glisse les coins pour épouser la feuille</p>
</div>
<div id="busy"><div class="spin"></div><div>Redressement en cours…</div><div class="pbar"><i id="pb"></i></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}},N=22;
const vid=$('#v'),ov=$('#ov'),poly=$('#poly'),dots=$('#dots'),pill=$('#pill'),prog=$('#prog');
let pend=null,jump=0,miss=0,K=.3,lt=0,lastT='',stream,W=0,H=0,quad=null,shown=null,stable=0,auto=true,busy=false,last=0,base=null,mode=1,locked=false;
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
for(let i=0;i<4;i++)dots.appendChild(document.createElementNS('http://www.w3.org/2000/svg','circle'));
const go=n=>{$('#cam').classList.toggle('off',n!=='cam');$('#res').classList.toggle('off',n!=='res');$('#ed').classList.toggle('off',n!=='ed')};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)};

async function start(){
  $('#err').textContent='';$('#go').textContent='Démarrage…';$('#go').style.opacity=.6;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});
    vid.srcObject=stream;await vid.play();
    try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    try{if(stream.getVideoTracks()[0].getCapabilities().torch)$('#torch').hidden=false}catch(e){}
    W=vid.videoWidth;H=vid.videoHeight;ov.setAttribute('viewBox','0 0 '+W+' '+H);
    $('#intro').classList.add('hide');vib(10);loop();
  }catch(e){$('#go').textContent='Réessayer';$('#go').style.opacity=1;$('#err').textContent='Caméra indisponible ici. Autorise l’accès ou importe une photo.'}
}

/* Détection : Otsu + plus grande zone claire + 4 coins extrêmes */
function detect0(el,vw,vh,w,dt){
  const h=Math.round(w*vh/vw),n=w*h;sc.width=w;sc.height=h;
  sx.drawImage(el,0,0,w,h);
  const d=sx.getImageData(0,0,w,h).data,g=new Uint8Array(n),hist=new Float32Array(256);
  for(let i=0;i<n;i++)g[i]=(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8;
  const g2=new Uint8Array(g);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const p=y*w+x;g2[p]=(g[p]*4+g[p-1]+g[p+1]+g[p-w]+g[p+w])>>3}
  g.set(g2);for(let i=0;i<n;i++)hist[g[i]]++;
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sb=0,wb=0,mx=0,t=128,cm=0;
  for(let i=0;i<256;i++){wb+=hist[i];const wf=n-wb;if(!wb)continue;if(!wf)break;sb+=i*hist[i];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>mx){mx=v;t=i;cm=mf-mb}}
  if(cm<10)return null;t=Math.max(8,Math.min(247,t+dt));
  const m=new Uint8Array(n),seen=new Uint8Array(n),st=new Int32Array(n);
  for(let i=0;i<n;i++)m[i]=g[i]>t?1:0;
  let best=null;
  for(let s=0;s<n;s++){
    if(!m[s]||seen[s])continue;
    let sp=0;st[sp++]=s;seen[s]=1;
    const c={n:0,pts:[]};
    while(sp){
      const p=st[--sp],x=p%w,y=(p/w)|0;c.n++;
      if(!m[p-1]||!m[p+1]||!m[p-w]||!m[p+w])c.pts.push(x,y);
      if(x>0&&m[p-1]&&!seen[p-1]){seen[p-1]=1;st[sp++]=p-1}
      if(x<w-1&&m[p+1]&&!seen[p+1]){seen[p+1]=1;st[sp++]=p+1}
      if(y>0&&m[p-w]&&!seen[p-w]){seen[p-w]=1;st[sp++]=p-w}
      if(y<h-1&&m[p+w]&&!seen[p+w]){seen[p+w]=1;st[sp++]=p+w}
    }
    if(!best||c.n>best.n)best=c;
  }
  if(!best||best.n<n*.06||best.n>n*.99)return null;
  const q=quadOf(best.pts);
  let ar=0;for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4];ar+=a[0]*b[1]-b[0]*a[1]}ar=Math.abs(ar)/2;
  if(!ar||best.n/ar<.4)return null;
  for(let i=0;i<4;i++)if(Math.hypot(q[i][0]-q[(i+1)%4][0],q[i][1]-q[(i+1)%4][1])<w*.1)return null;
  const k=vw/w,cx=(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4,cy=(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4,r=Math.max(2,w/50);
  let cn=0,ps=0,sm=0;
  for(let e=0;e<4;e++){
    const a=q[e],b=q[(e+1)%4],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;let nx=dy/L,ny=-dx/L;
    if(nx*(cx-a[0])+ny*(cy-a[1])<0){nx=-nx;ny=-ny}
    for(let i=0;i<10;i++){
      const t2=(i+.5)/10,px=a[0]+dx*t2,py=a[1]+dy*t2,ix=Math.round(px+nx*r),iy=Math.round(py+ny*r),ox=Math.round(px-nx*r),oy=Math.round(py-ny*r);
      if(ix<0||iy<0||ox<0||oy<0||ix>=w||ox>=w||iy>=h||oy>=h)continue;
      const df=g[iy*w+ix]-g[oy*w+ox];cn++;sm+=df;if(df>5)ps++;
    }
  }
  if(cn>=10&&(ps/cn<.55||sm/cn<7))return null;
  const o=q.map(p=>[(p[0]+.5)*k,(p[1]+.5)*k]);
  o.sc=(cn>=10?ps/cn*Math.min(1,sm/cn/28):.55)*Math.sqrt(best.n/n);return o;
}

/* Coins robustes : rectangle d’aire minimale (toute rotation), puis extrêmes diagonaux = perspective */
const dq=(a,b)=>a.reduce((s,p,i)=>s+Math.hypot(p[0]-b[i][0],p[1]-b[i][1]),0)/4/W;
/* Multi-seuils + validation des bords + suivi de la feuille déjà détectée */
function detect(el,vw,vh,w=192){
  let b=null;
  for(const dt of [0,-24,24,-48]){
    const q=detect0(el,vw,vh,w,dt);if(!q)continue;
    let s=q.sc;
    if(quad&&el===vid){const d=q.reduce((a,p,i)=>a+Math.hypot(p[0]-quad[i][0],p[1]-quad[i][1]),0)/4/vw;s*=1+Math.max(0,.2-d)*3}
    if(!b||s>b.s)b={q,s};
    if(s>.5)break;
  }
  return b&&b.q;
}
function quadOf(P){
  let bt=0,ba=1e18;
  for(let t=-45;t<45;t+=3){const r=t*Math.PI/180,c=Math.cos(r),s=Math.sin(r);let a=1e9,b=-1e9,e=1e9,f=-1e9;
    for(let i=0;i<P.length;i+=2){const u=P[i]*c+P[i+1]*s,v=P[i+1]*c-P[i]*s;if(u<a)a=u;if(u>b)b=u;if(v<e)e=v;if(v>f)f=v}
    const ar=(b-a)*(f-e);if(ar<ba){ba=ar;bt=r}}
  const c=Math.cos(bt),s=Math.sin(bt),m=[1e9,-1e9,-1e9,1e9],Q=[[0,0],[0,0],[0,0],[0,0]];
  for(let i=0;i<P.length;i+=2){const x=P[i],y=P[i+1],u=x*c+y*s,v=y*c-x*s,a=u+v,b=u-v;
    if(a<m[0]){m[0]=a;Q[0]=[x,y]}if(b>m[1]){m[1]=b;Q[1]=[x,y]}if(a>m[2]){m[2]=a;Q[2]=[x,y]}if(b<m[3]){m[3]=b;Q[3]=[x,y]}}
  return Q;
}
function loop(){
  if(!stream)return;requestAnimationFrame(loop);
  const t=performance.now();K=1-Math.exp(-Math.min(64,t-lt)/50);lt=t;
  if(!busy&&vid.readyState>1&&t-last>(quad?33:66)){last=t;step(detect(vid,W,H))}
  draw();
}
function step(q){
  if(!q){pend=null;if(quad&&++miss<=6){stable=Math.max(0,stable-1);return ui()}quad=null;stable=0;miss=0;return ui()}
  miss=0;if(!quad){if(pend&&dq(pend,q)<.05){quad=q;pend=null;jump=0;vib(8)}else{pend=q;return ui()}}else{
    const mv=q.reduce((s,p,i)=>s+Math.hypot(p[0]-quad[i][0],p[1]-quad[i][1]),0)/4/W;
    if(mv>.1){if(++jump>=3){quad=q;stable=0;jump=0}else stable=0}
    else{jump=0;if(mv>.004)quad=quad.map((p,i)=>[p[0]+(q[i][0]-p[0])*.55,p[1]+(q[i][1]-p[1])*.55]);stable=mv<.009?stable+1:Math.max(0,stable-2)}
  }
  ui();
  if(auto&&stable>=N)capture();
}
function ui(){
  const lock=!!quad&&stable>=6;
  if(lock&&!locked)vib(14);locked=lock;
  poly.classList.toggle('lock',lock);pill.classList.toggle('ok',lock);
  const tx=!quad?'Cherche une feuille…':lock?(auto?'Ne bouge plus…':'Prête — appuie pour capturer'):'Feuille détectée';
  if(tx!==lastT){lastT=tx;pill.textContent=tx;pill.classList.remove('b');void pill.offsetWidth;pill.classList.add('b')}
  $('#cam').classList.toggle('has',!!quad);
  prog.style.strokeDashoffset=238.76*(1-(quad&&auto?Math.min(1,stable/N):0));
}
function draw(){
  if(!quad){shown=null;poly.style.opacity=0;dots.style.opacity=0;return}
  shown=shown?shown.map((p,i)=>[p[0]+(quad[i][0]-p[0])*K,p[1]+(quad[i][1]-p[1])*K]):quad.map(p=>p.slice());
  poly.setAttribute('points',shown.map(p=>p.join(',')).join(' '));poly.style.opacity=1;dots.style.opacity=1;
  [...dots.children].forEach((c,i)=>{c.setAttribute('cx',shown[i][0]);c.setAttribute('cy',shown[i][1]);c.setAttribute('r',W*.009)});
}

async function capture(){
  if(busy)return;busy=true;vib([25,40,25]);poly.classList.add('snap');setTimeout(()=>poly.classList.remove('snap'),280);
  const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(vid,0,0);
  let q=quad?quad.map(p=>p.slice()):full(W,H);
  const hq=detect(c,W,H,480);
  if(hq&&(!quad||hq.reduce((s,p,i)=>s+Math.hypot(p[0]-q[i][0],p[1]-q[i][1]),0)/4/W<.05))q=hq;
  stable=0;ui();await process(c,q);
}
const full=(w,h)=>[[w*.03,h*.03],[w*.97,h*.03],[w*.97,h*.97],[w*.03,h*.97]];

async function process(src,q){
  busy=true;$('#busy').classList.add('on');
  await new Promise(r=>setTimeout(r,60));
  lastSrc=src;lastQ=q.map(p=>p.slice());base=await warp(src,q);mode=1;ang=0;$('#tilt').value=0;$('#ttl').textContent='Document';show();
  $('#busy').classList.remove('on');go('res');
}

/* Redressement perspective (homographie) + échantillonnage bilinéaire */
async function warp(src,q){
  const sw=src.width,sh=src.height,sd=src.getContext('2d').getImageData(0,0,sw,sh).data,L=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let w=Math.max(L(q[0],q[1]),L(q[3],q[2])),h=Math.max(L(q[0],q[3]),L(q[1],q[2]));
  const k=Math.min(1,2600/Math.max(w,h));w=Math.max(2,Math.round(w*k));h=Math.max(2,Math.round(h*k));
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q,sX=x0-x1+x2-x3,sY=y0-y1+y2-y3,dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,den=dx1*dy2-dx2*dy1;
  const g=den?(sX*dy2-dx2*sY)/den:0,hh=den?(dx1*sY-sX*dy1)/den:0;
  const a=x1-x0+g*x1,b=x3-x0+hh*x3,d=y1-y0+g*y1,e=y3-y0+hh*y3;
  const out=new ImageData(w,h),o=out.data,mxX=sw-1.001,mxY=sh-1.001;
  for(let y=0;y<h;y++){if(!(y%160)){bar(y/h);await new Promise(r=>requestAnimationFrame(r))}const v=y/h;for(let x=0;x<w;x++){
    const u=x/w,dn=g*u+hh*v+1;let X=(a*u+b*v+x0)/dn,Y=(d*u+e*v+y0)/dn;
    X=X<0?0:X>mxX?mxX:X;Y=Y<0?0:Y>mxY?mxY:Y;
    const ix=X|0,iy=Y|0,fx=X-ix,fy=Y-iy,p=(iy*sw+ix)*4,r=p+sw*4,wa=(1-fx)*(1-fy),wb=fx*(1-fy),wc=(1-fx)*fy,wd=fx*fy,j=(y*w+x)*4;
    o[j]=sd[p]*wa+sd[p+4]*wb+sd[r]*wc+sd[r+4]*wd;
    o[j+1]=sd[p+1]*wa+sd[p+5]*wb+sd[r+1]*wc+sd[r+5]*wd;
    o[j+2]=sd[p+2]*wa+sd[p+6]*wb+sd[r+2]*wc+sd[r+6]*wd;o[j+3]=255}}
  return out;
}

/* Filtres */
function filt(b,m){
  const o=new ImageData(new Uint8ClampedArray(b.data),b.width,b.height);if(!m)return o;
  const d=o.data,n=d.length/4,hs=new Uint32Array(256);
  for(let i=0;i<n;i++)hs[(d[i*4]*77+d[i*4+1]*150+d[i*4+2]*29)>>8]++;
  const pc=f=>{let c=0,t=n*f;for(let i=0;i<256;i++){c+=hs[i];if(c>=t)return i}return 255};
  const lo=pc(.02),hi=Math.max(lo+20,pc(m==1?.55:.5)),s=255/(hi-lo);
  for(let i=0;i<n;i++){const j=i*4;
    if(m==1){for(let c=0;c<3;c++){const v=(d[j+c]-lo)*s;d[j+c]=v}}
    else{let v=((d[j]*77+d[j+1]*150+d[j+2]*29)/256-lo)/(hi-lo);v=v<0?0:v>1?1:v;v=v*v*(3-2*v);v=v*v*(3-2*v);d[j]=d[j+1]=d[j+2]=v*255}}
  return o;
}
function show(){
  const o=filt(base,mode);fc.width=o.width;fc.height=o.height;fc.getContext('2d').putImageData(o,0,0);render();
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',+b.dataset.m===mode));
  $('.thumb').style.transform='translateX('+mode*100+'%)';
}

/* Redressement : rotation, inclinaison fine, recadrage manuel */
const NS='http://www.w3.org/2000/svg',fc=document.createElement('canvas');let lastSrc,lastQ,eq,ang=0;
const bar=f=>{$('#pb').style.transform='scaleX('+f+')'};
function render(){
  const c=$('#rc'),w=fc.width,h=fc.height,x=c.getContext('2d'),r=ang*Math.PI/180,k=Math.cos(Math.abs(r))+Math.max(w/h,h/w)*Math.sin(Math.abs(r));
  c.width=w;c.height=h;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.translate(w/2,h/2);x.rotate(r);x.scale(k,k);x.drawImage(fc,-w/2,-h/2);
}
function rot(d){
  const s=document.createElement('canvas'),t=document.createElement('canvas'),bw=base.width,bh=base.height;
  s.width=bw;s.height=bh;s.getContext('2d').putImageData(base,0,0);t.width=bh;t.height=bw;
  const x=t.getContext('2d');x.translate(bh/2,bw/2);x.rotate(d*Math.PI/2);x.drawImage(s,-bw/2,-bh/2);
  base=x.getImageData(0,0,bh,bw);show();
}
function edit(){
  if(!lastSrc)return;
  const c=$('#ec'),s=$('#es');c.width=lastSrc.width;c.height=lastSrc.height;c.getContext('2d').drawImage(lastSrc,0,0);
  s.setAttribute('viewBox','0 0 '+c.width+' '+c.height);eq=lastQ.map(p=>p.slice());
  s.querySelectorAll('circle').forEach(n=>n.remove());
  eq.forEach((p,i)=>{
    const h=document.createElementNS(NS,'circle');h.setAttribute('r',c.width*.04);h.setAttribute('class','hd');
    h.onpointerdown=e=>{h.setPointerCapture(e.pointerId);h._d=1;vib(8)};
    h.onpointermove=e=>{if(!h._d)return;const r=s.getBoundingClientRect();eq[i]=[Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*c.width,Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))*c.height];upd()};
    h.onpointerup=()=>{h._d=0;vib(5)};s.appendChild(h);
  });
  upd();go('ed');
}
function upd(){
  $('#ep').setAttribute('points',eq.map(p=>p.join(',')).join(' '));
  $('#es').querySelectorAll('circle').forEach((h,i)=>{h.setAttribute('cx',eq[i][0]);h.setAttribute('cy',eq[i][1])});
}
/* Export */
async function save(name,blob){
  try{
    const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});toast('Enregistré ✓');vib(15);return}
  }catch(e){if(e&&e.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Téléchargé ✓');
}
const jpgBlob=()=>new Promise(r=>$('#rc').toBlob(r,'image/jpeg',.94));
const stamp=()=>'scan-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
function pdf(jpg,w,h){
  const W=595,Hh=Math.round(595*h/w),enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length},obj=s=>{offs.push(len);add(s)};
  add('%PDF-1.4\n');
  obj('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
  obj('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n');
  obj('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+W+' '+Hh+']/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>endobj\n');
  offs.push(len);add('4 0 obj<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>stream\n');add(jpg);add('\nendstream endobj\n');
  const cs='q '+W+' 0 0 '+Hh+' 0 0 cm /I Do Q';
  obj('5 0 obj<</Length '+cs.length+'>>stream\n'+cs+'\nendstream endobj\n');
  const x=len;let t='xref\n0 6\n0000000000 65535 f \n';offs.forEach(o=>t+=String(o).padStart(10,'0')+' 00000 n \n');
  add(t+'trailer<</Size 6/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

/* Événements */
$('#go').onclick=start;document.querySelectorAll('#intro>*').forEach((e,i)=>e.style.animationDelay=i*70+'ms');
$('#rl').onclick=()=>{vib(8);rot(-1)};$('#rr').onclick=()=>{vib(8);rot(1)};
$('#tilt').oninput=e=>{ang=+e.target.value;if(!ang)vib(6);$('#ttl').textContent=(ang>0?'+':'')+ang.toFixed(1)+'°';render()};
$('#tilt').onchange=()=>{$('#ttl').textContent='Document'};
$('#redit').onclick=edit;$('#ecan').onclick=()=>{vib(6);go('res')};$('#eok').onclick=()=>{vib(10);process(lastSrc,eq)};
$('#dshare').onclick=async()=>{vib(10);try{await navigator.share({files:[new File([await jpgBlob()],stamp()+'.jpg',{type:'image/jpeg'})]})}catch(e){}};
try{if(!(navigator.canShare&&navigator.canShare({files:[new File(['a'],'a.jpg',{type:'image/jpeg'})]})))$('#dshare').hidden=true}catch(e){$('#dshare').hidden=true}
$('#shut').onclick=capture;
$('#torch').onclick=async e=>{const b=e.currentTarget;b.on=!b.on;b.classList.toggle('on',b.on);vib(8);try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:b.on}]})}catch(x){}};
$('#auto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);stable=0;ui();vib(8)};
$('#back').onclick=()=>{vib(8);busy=false;stable=0;go('cam');if(!stream)$('#intro').classList.remove('hide')};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=+b.dataset.m;vib(6);show()};
$('#djpg').onclick=async()=>{vib(10);save(stamp()+'.jpg',await jpgBlob())};
$('#dpdf').onclick=async()=>{vib(10);const c=$('#rc'),j=new Uint8Array(await (await jpgBlob()).arrayBuffer());save(stamp()+'.pdf',pdf(j,c.width,c.height))};
async function imp(e){
  const f=e.target.files[0];if(!f)return;busy=true;
  try{
    const bm=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,4096/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    await process(c,detect(c,c.width,c.height,480)||full(c.width,c.height));
  }catch(x){busy=false;toast('Image illisible')}
  e.target.value='';
}
$('#f').onchange=imp;$('#f2').onchange=imp;
</script>
</body>
